[package]
name = "effectcraft-ui-egui"
description = "The EffectCraft egui frontend (swappable): docking panels, composition viewer, timeline, effect controls, control channel"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
craft-ui = { workspace = true }
craft-quit = { workspace = true, features = ["egui"] }
effectcraft-time = { workspace = true }
effectcraft-geom = { workspace = true }
effectcraft-color = { workspace = true }
effectcraft-keyframe = { workspace = true }
effectcraft-project = { workspace = true }
effectcraft-path = { workspace = true }
effectcraft-text = { workspace = true }
effectcraft-render = { workspace = true }
effectcraft-engine = { workspace = true }
effectcraft-gpu = { workspace = true }
egui = { workspace = true }
egui_extras = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "clipboard"] }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
chrono = { workspace = true }
rayon = { workspace = true }
web-time = { workspace = true }
kurbo = { workspace = true }
image = { workspace = true }
# Half-float viewer frames of 32 bpc projects (F16C is picked at run time).
half = { workspace = true }
bytemuck = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Floating panels open in OS windows of their own on desktop; the web keeps them in the page. Android
# compiles like the desktop and embeds viewports at run time (`set_embed_viewports(true)`).
craft-ui = { workspace = true, features = ["native-windows"] }

# eframe's `accesskit` feature is not available with Android's `android-native-activity` (it is a
# compile_error!), so it is enabled everywhere except Android.
[target.'cfg(not(target_os = "android"))'.dependencies]
eframe = { workspace = true, features = ["accesskit"] }

# The in-app updater is desktop only (build.rs sets `ec_no_updater` on wasm32 and Android).
[target.'cfg(not(any(target_arch = "wasm32", target_os = "android")))'.dependencies]
craft-update = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.pollster]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.sys-locale]
workspace = true

[dev-dependencies]
# Fonts for kittest: the workspace `egui` features are what test roots resolve, but stating them
# here documents the requirement (kittest's own dev-dependencies do not propagate to consumers).
egui = { workspace = true, features = ["default_fonts", "monochrome_emoji_fonts"] }
egui_kittest = { workspace = true, features = ["eframe", "wgpu"] }
pollster = "1"
effectcraft-segment = { workspace = true }
effectcraft-host = { workspace = true }
effectcraft-media = { workspace = true }
exr = { workspace = true }
tempfile = { workspace = true }

[build-dependencies]
serde_json = { workspace = true }
toml = "1"
